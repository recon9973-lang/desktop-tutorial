<!-- ===========================================================
   VENOM 블로그(인사이트) 목록 — Framer "Embed(HTML)" 에 붙여넣기.
   기존 베놈 블로그(blog-posts.json)를 그대로 렌더합니다.
   상세글은 detailBase 링크(예: 별도 블로그 페이지)로 연결하세요.
   =========================================================== -->
<div id="venom-posts" data-limit="3" data-detail="/blog?slug="></div>

<style>
  #venom-posts{--vp-ink:#15181B;--vp-muted:#6B7076;--vp-line:rgba(21,24,27,.14);--vp-card:#F4F5F6;--vp-accent:#FF4A1C;
    font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  #venom-posts .vp-card{border:1px solid var(--vp-line);border-radius:14px;padding:24px;background:var(--vp-card);
    display:flex;flex-direction:column;gap:12px;color:var(--vp-ink);transition:transform .25s,border-color .25s;text-decoration:none}
  #venom-posts .vp-card:hover{transform:translateY(-4px);border-color:var(--vp-ink)}
  #venom-posts .vp-meta{color:var(--vp-muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
  #venom-posts .vp-title{font-size:18px;font-weight:700;letter-spacing:-.02em;line-height:1.3}
  #venom-posts .vp-ex{color:var(--vp-muted);font-size:14px;margin-top:auto}
  #venom-posts .vp-arw{color:var(--vp-accent);font-weight:600;font-size:14px}
  #venom-posts .vp-empty{grid-column:1/-1;color:var(--vp-muted)}
  @media(max-width:820px){#venom-posts{grid-template-columns:1fr}}
</style>

<script>
(function(){
  var API_BASE = "https://desktop-tutorial-chi-peach.vercel.app";
  var root = document.getElementById("venom-posts");
  var limit = parseInt(root.getAttribute("data-limit")||"3",10);
  var base  = root.getAttribute("data-detail")||"/blog?slug=";
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
  function fmt(d){try{var t=new Date(d);return t.getFullYear()+"."+(t.getMonth()+1)+"."+t.getDate();}catch(e){return d;}}
  fetch(API_BASE + "/content/blog-posts.json?_=" + Date.now())
    .then(function(r){ return r.ok ? r.json() : []; })
    .then(function(d){
      var arr = Array.isArray(d) ? d : (d && d.posts) || [];
      arr = arr.filter(function(p){ return !p.status || p.status === "published"; }).slice(0, limit);
      if(!arr.length){ root.innerHTML = '<p class="vp-empty">준비 중입니다. 곧 인사이트가 올라옵니다.</p>'; return; }
      root.innerHTML = arr.map(function(p){
        var href = base + encodeURIComponent(p.slug || p.id);
        return '<a class="vp-card" href="'+href+'">'+
          '<span class="vp-meta">'+esc(p.category||"인사이트")+(p.date?" · "+esc(fmt(p.date)):"")+'</span>'+
          '<span class="vp-title">'+esc(p.title||"")+'</span>'+
          (p.excerpt?'<span class="vp-ex">'+esc(p.excerpt)+'</span>':'')+
          '<span class="vp-arw">읽기 ↗</span></a>';
      }).join("");
    })
    .catch(function(){ root.innerHTML = '<p class="vp-empty">인사이트를 불러오지 못했습니다.</p>'; });
})();
</script>
