[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "veo-worker"
version = "0.1.0"
description = "VEO — asynchronous job runtime (Celery). Developed by VENOM. Research & Methodology by VEO-LAB."
requires-python = ">=3.12"
dependencies = [
    "veo-api",
    "celery>=5.4,<6.0",
    "redis>=5.1,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.7,<1.0",
    "mypy>=1.13,<2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/veo_worker"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "requires_redis: test needs a live Redis broker (VEO_TEST_REDIS_URL)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["veo_worker"]
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

# celery and kombu ship no type information. veo-api has no py.typed marker yet either —
# see apps/worker/INTEGRATION_REQUEST.md; once it gains one, drop "veo.*" from this list
# so contract types are checked for real instead of degrading to Any.
[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*", "veo.*"]
ignore_missing_imports = true

# Celery's task decorator is untyped, so every registered task looks untyped to mypy.
# Scoped to the task module only, so the rest of the package keeps strict checking.
[[tool.mypy.overrides]]
module = "veo_worker.runtime.tasks"
disallow_untyped_decorators = false
