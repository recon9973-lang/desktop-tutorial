[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "veo-api"
version = "0.1.0"
description = "VEO — SEO · GEO · Naver Keyword Intelligence Platform (API). Developed by VENOM. Research & Methodology by VEO-LAB."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.118,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "celery>=5.4,<6.0",
    "redis>=5.1,<7.0",
    "pyyaml>=6.0,<7.0",
    "jsonschema>=4.23,<5.0",
    "httpx>=0.27,<1.0",
    "pyjwt>=2.9,<3.0",
    "argon2-cffi>=23.1,<26.0",
    # AES-256-GCM for the provider-credential vault. Hand-rolling authenticated
    # encryption is not an option for a store of customer API secrets.
    # 46.0.7 이하는 GHSA-537c-gmf6-5ccf 에 걸린다. 48.0.1 에서 고쳐졌고, 그 버전은
    # 옛 상한(<47.0) 밖이라 상한도 함께 올렸다. CI 의 의존성 감사가 잡아 준 것이다.
    # 48.0.1 에는 알려진 취약점이 셋 있다(PYSEC-2026-3552/3553/3554). 셋 다 막으려면
    # 50.0.0 이 필요하다 — 49.0.0 은 그중 둘만 고친다. 이 취약점들 때문에 CI 의
    # 의존성 감사 단계가 계속 빨간불이었다.
    "cryptography>=50.0,<51.0",
    "structlog>=24.4,<26.0",
    "python-multipart>=0.0.12,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
    # 8.4.2 이하는 PYSEC-2026-1845 에 걸린다. 고친 버전이 9.0.3 이라 메이저 승격이
    # 불가피했다. 승격 전에 apps/api·apps/worker 전체(4,430건)를 9.0.3 으로 돌려
    # 통과와 경고 목록이 8.4.2 와 동일함을 확인했다. 개발 전용 의존성이라 런타임
    # 이미지에는 들어가지 않는다.
    "pytest>=9.0.3,<10.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.7,<1.0",
    "mypy>=1.13,<2.0",
    "types-PyYAML",
    "types-jsonschema",
]

[tool.hatch.build.targets.wheel]
packages = ["src/veo"]

# Ship the PEP 561 marker so consumers (apps/worker, future services) get real types
# from the shared contracts instead of silently degrading every symbol to Any.
[tool.hatch.build.targets.wheel.force-include]
"src/veo/py.typed" = "veo/py.typed"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
# importlib import mode: without it, two test modules sharing a basename in different
# directories (tests/seo/test_router.py and tests/geo/test_router.py) collide during
# collection, because the default prepend mode imports them as top-level modules keyed
# by basename alone. With importlib each engine can name its files naturally.
addopts = "-q --strict-markers --import-mode=importlib"
markers = [
    "requires_postgres: test needs a live PostgreSQL instance (VEO_TEST_DATABASE_URL)",
    "requires_redis: test needs a live Redis broker (VEO_TEST_REDIS_URL)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"
# Alembic writes these files; reformatting generated migrations only creates noise
# in the diff and makes a regenerated migration look like a hand edit.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["veo"]
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

# Celery 는 타입 스텁도 `py.typed` 표식도 배포하지 않는다. 우리 코드의 문제가 아니고
# 우리가 고칠 수 있는 것도 아닌데, strict 모드에서는 오류로 잡혀 **타입체크 단계 전체가
# 실패**한다. 그 실패가 뒤따르는 검사를 가려서 진짜 결함(2026-08-04 의 `read_captures`
# 미정의)이 세 판의 배포를 그대로 통과했다.
#
# 이 예외는 celery 와 그 전송 계층(kombu)에만 준다. `dispatch.py` 는 큐로 보내는
# 모듈을 함수 안에서 늦게 import 하고 실패하면 예전 방식으로 떨어지므로, 여기서 잃는
# 검사는 `producer.py` 의 앱 구성 몇 줄뿐이다.
[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*"]
ignore_missing_imports = true
