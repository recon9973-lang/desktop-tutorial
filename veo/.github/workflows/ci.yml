# =============================================================================
# ★ 이 워크플로는 `veo-platform` 리포지터리에서 돕니다
#
# 이 파일은 `veo/.github/workflows/ci.yml` 에 있고, `git subtree push --prefix=veo`
# 로 밀리면 `veo-platform` 리포지터리의 **루트** `.github/workflows/ci.yml` 이 됩니다.
# 즉 실행될 때 `veo/` 라는 디렉터리는 **존재하지 않습니다** — `apps/`, `packages/`,
# `tests/` 가 바로 루트에 있습니다.
#
# 한동안 이 사실이 반영되지 않아 CI 가 **모든 푸시에서 전부 실패**했습니다.
# `defaults.run.working-directory: veo` 가 남아 있어 셸이 시작조차 못 했습니다.
#
#     An error occurred trying to start process '/usr/bin/bash' with working
#     directory '/home/runner/work/veo-platform/veo-platform/veo'.
#
# 잡이 전부 빨간불인데도 아무도 보지 않아 아홉 번의 푸시가 그대로 지나갔습니다.
# 로컬에서 `make ci-local` 이 초록이라는 사실은 이것을 대신하지 못합니다 — 지침서
# 0-F 가 말하는 "초록불은 동작이 아니다" 가 CI 자신에게 일어난 경우입니다.
#
# 그래서 `tests/release/test_ci_paths.py` 가 이 파일의 경로를 검사합니다. 다시
# `veo/` 접두사가 들어오면 로컬 테스트가 먼저 실패합니다.
#
# 남은 일 (저장소 설정, 코드로 할 수 없음)
#   - 이 워크플로를 **필수 상태 검사(required check)** 로 지정하십시오.
#     지정하지 않으면 CI 는 빨간불이어도 머지를 막지 못합니다.
# =============================================================================

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# 같은 브랜치에서 새 푸시가 오면 진행 중인 실행을 취소한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 기본 권한을 읽기로 좁힌다. 필요한 잡에서만 개별적으로 올린다.
permissions:
  contents: read

env:
  # apps/api/pyproject.toml 의 requires-python 및 target-version 과 일치시킨다.
  PYTHON_VERSION: "3.12"
  # 스코어링 명세는 데이터다. 경로를 명시해 자동 탐색에 의존하지 않는다.
  VEO_SCORING_SPECS_DIR: ${{ github.workspace }}/packages/scoring-specs

jobs:
  # ===========================================================================
  # 정적 검사 — 린트와 타입
  # ===========================================================================
  static:
    name: 린트 · 타입체크
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -e "apps/api[dev]"

      # 포맷 검사(ruff format --check)는 일부러 넣지 않았다.
      # 현재 코드베이스가 ruff format 을 채택하지 않은 상태라, 지금 켜면
      # 실제 결함과 무관한 실패로 게이트의 신뢰도를 떨어뜨린다.
      # 포맷을 도입하기로 결정하면 한 번에 전체 포맷을 적용한 커밋을 넣고
      # 그다음 커밋에서 이 단계를 추가한다.
      - name: ruff (린트)
        run: ruff check apps/api

      - name: mypy (타입체크)
        working-directory: apps/api
        run: mypy

  # ===========================================================================
  # 웹 — 타입체크·린트·테스트, 그리고 **실제 프로덕션 빌드**
  #
  # 빌드를 여기서 돌리는 이유가 있다. 타입체크·테스트·린트가 모두 통과했는데
  # `next build` 만 실패한 일이 실제로 있었다 — Next.js 16 이 `middleware` 규약을
  # `proxy` 로 바꿨는데 둘 다 존재해서 났고, 그 오류는 빌드 단계에서만 난다.
  #
  # 그때 빌드를 돌리는 곳은 Vercel뿐이었고, Vercel 은 **이미 배포한 뒤**에 실패한다.
  # 화면은 옛 코드로 남고, 고쳤다고 말한 기능은 실제로는 없는 상태가 된다.
  # ===========================================================================
  web:
    name: 웹 · 빌드까지
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 타입체크
        run: pnpm -r typecheck

      - name: 린트
        run: pnpm -r lint

      - name: 단위 테스트
        run: pnpm -r test

      # 이 단계가 이 작업의 존재 이유다. 앞의 셋이 다 통과해도 여기서 깨질 수 있다.
      - name: 프로덕션 빌드
        working-directory: apps/web
        run: pnpm build

  # ===========================================================================
  # 단위 테스트 — 외부 의존성 없이, 완전 오프라인
  # ===========================================================================
  unit:
    name: 단위 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -e "apps/api[dev]"

      # VEO_TEST_DATABASE_URL 을 주지 않으므로 DB 테스트는 skip 된다.
      # 그 커버리지는 아래 database 잡이 책임진다.
      - name: pytest (apps/api)
        run: pytest apps/api/tests -q

  # ===========================================================================
  # 계약 테스트 — 파이썬 열거형과 packages/shared-types 가 어긋나지 않았는지
  # ===========================================================================
  contract:
    name: 계약 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -e "apps/api[dev]"

      # 경로가 `apps/api/tests/contract` 인 것이 중요하다. 루트의 `tests/contract` 는
      # 비어 있고, 한동안 이 잡이 그쪽을 보면서 "없으니 통과" 로 빠져나갔다 —
      # **계약 테스트 잡이 한 번도 테스트를 돌린 적이 없었다.**
      #
      # 비었을 때 조용히 통과하는 길도 없앤다. 계약 검증이 사라진 것은 경고가 아니라
      # 실패다. 경고는 초록불 옆에서 읽히지 않는다.
      - name: pytest (apps/api/tests/contract)
        run: pytest apps/api/tests/contract -q

  # ===========================================================================
  # 데이터베이스 — 실제 PostgreSQL 16 에 대고 마이그레이션 up/down 검증
  #
  # downgrade 를 반드시 검증한다. 되돌릴 수 없는 마이그레이션은 배포 사고가
  # 났을 때 롤백 경로를 통째로 막기 때문이다.
  # ===========================================================================
  database:
    name: 마이그레이션 · DB 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: veo
          # CI 전용 일회성 인스턴스. 러너 안에서만 살아 있고 외부에 노출되지 않는다.
          POSTGRES_PASSWORD: veo_ci_ephemeral
          POSTGRES_DB: veo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veo -d veo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      VEO_TEST_DATABASE_URL: postgresql+psycopg://veo:veo_ci_ephemeral@localhost:5432/veo_test
      VEO_DATABASE_URL: postgresql+psycopg://veo:veo_ci_ephemeral@localhost:5432/veo_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -e "apps/api[dev]"

      - name: 마이그레이션 적용 (upgrade head)
        working-directory: apps/api
        run: alembic upgrade head

      - name: 마이그레이션 되돌리기 (downgrade base)
        working-directory: apps/api
        run: alembic downgrade base

      - name: 되돌린 뒤 재적용 (반복 가능성 확인)
        working-directory: apps/api
        run: alembic upgrade head

      # 스키마가 실제로 사라졌다 다시 생기는지는 아래 테스트가 검증한다.
      # (drift 검사 포함: 모델과 마이그레이션이 어긋나면 실패)
      - name: DB 테스트 (requires_postgres)
        run: pytest apps/api/tests -q -m requires_postgres

  # ===========================================================================
  # 의존성 취약점 감사
  # ===========================================================================
  dependency-audit:
    name: 의존성 감사 (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: pip-audit 설치
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      # 설치된 의존성 트리 전체를 PyPI 취약점 DB(OSV) 와 대조한다.
      # 취약점이 나오면 실패시킨다. 예외가 필요하면 --ignore-vuln 에
      # 근거(사유·재평가 날짜)를 주석으로 함께 남긴다.
      # `--skip-editable`: 편집 설치된 `veo-api` 자신은 PyPI 에 없어 감사할 수 없다.
      # 없으면 "Dependency not found on PyPI" 로 잡 전체가 실패한다. 이 도구는 우리
      # 코드가 아니라 **의존성**을 보는 것이므로 빼는 것이 맞다.
      #
      # `--strict` 는 함께 못 쓴다. 건너뛴 항목을 전부 실패로 치므로 위의 제외와
      # 정면으로 부딪힌다. 취약점이 나오면 어차피 종료코드가 1 이라 게이트는 선다.
      - name: 취약점 스캔
        run: |
          pip install -e "apps/api"
          pip-audit --skip-editable --progress-spinner off

  # ===========================================================================
  # 비밀값 스캔
  #
  # 커밋 이력에 들어간 자격증명을 찾는다. 이미 푸시된 비밀은 되돌릴 수 없으므로
  # (지워도 이력·포크·캐시에 남는다) 반드시 "폐기 후 재발급"으로 대응한다.
  # 절차: docs/operations/runbook-credential-rotation.md
  # ===========================================================================
  secret-scan:
    name: 비밀값 스캔 (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # 전체 이력을 받아야 과거 커밋에 묻힌 비밀도 검출된다.
          fetch-depth: 0

      - name: gitleaks 실행
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================================================
  # 전체 통과 여부를 한 곳으로 모은다.
  # 브랜치 보호 규칙에서는 이 잡 하나만 필수 검사로 지정하면 된다.
  # ===========================================================================
  # `web` 이 이 목록에 없었다. 프런트엔드가 빨간불이어도 "모든 검사를 통과했습니다"
  # 가 찍혔다는 뜻이다. 게이트가 빠뜨린 잡은 게이트가 아니다.
  ci-passed:
    name: CI 통과
    runs-on: ubuntu-latest
    needs: [static, web, unit, contract, database, dependency-audit, secret-scan]
    if: always()
    steps:
      - name: 선행 잡 결과 확인
        run: |
          echo "static:           ${{ needs.static.result }}"
          echo "web:              ${{ needs.web.result }}"
          echo "unit:             ${{ needs.unit.result }}"
          echo "contract:         ${{ needs.contract.result }}"
          echo "database:         ${{ needs.database.result }}"
          echo "dependency-audit: ${{ needs.dependency-audit.result }}"
          echo "secret-scan:      ${{ needs.secret-scan.result }}"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error title=CI 실패::하나 이상의 검사가 실패했습니다."
            exit 1
          fi
          echo "모든 검사를 통과했습니다."
