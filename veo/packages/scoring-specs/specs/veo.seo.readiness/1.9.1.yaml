      운영자가 믿고 있는 상태와 실제가 달라집니다.
    points: 0.15
  - id: seo.crawl.favicon_declared_and_crawlable
    title_ko: 파비콘이 선언되고 크롤링 가능한가
    title_en: Favicon declared and crawlable
    severity: MINOR
    scope: SITE
    remediation_owner: DEVELOPER
    applicability_ko: 대표 페이지에 적용됩니다.
    evidence_required:
    - dom_snippet
    reference_ko: 구글은 검색 결과에 파비콘을 표시하며, Googlebot-Image 가 그 파일을 크롤링할 수 있어야 합니다. robots.txt 로 막혀 있으면
      선언해도 표시되지 않습니다.
    points: 0.1
  - id: seo.html.doctype_standards_mode
    title_ko: HTML5 doctype 이 선언됐는가
    title_en: HTML5 doctype declared
    severity: MINOR
    scope: URL
    remediation_owner: DEVELOPER
    applicability_ko: 모든 HTML 페이지에 적용됩니다.
    evidence_required:
    - dom_snippet
    reference_ko: doctype 이 없으면 브라우저가 쿼크 모드로 렌더링해 레이아웃이 의도와 달라질 수 있습니다. 구글이 요구하는 항목은 아니지만 렌더링 결과가 달라지면
      판정도 달라집니다.
    points: 0.05
