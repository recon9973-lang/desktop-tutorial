# VEO SEO Technical Readiness Scoring Specification
# Methodology: VEO-LAB / Implementation: VENOM
# This file is the single source of truth for SEO weights, severities and caps.
# Checker code MUST NOT hard-code any number that appears here.
spec_id: veo.seo.readiness
domain: SEO_READINESS
version: 1.0.0
status: PUBLISHED
effective_at: "2026-07-28T00:00:00+09:00"
methodology_owner: VEO-LAB
implementation_owner: VENOM
approved_by: VEO-LAB
compatible_collector_versions:
  - "seo-collector/1.x"

score_meaning:
  ko: >-
    검색엔진이 사이트를 발견·크롤링·해석·제공할 수 있는 기술·운영 준비도입니다.
    검색 순위 예측값이 아니며, 실제 검색 성과(노출·클릭·순위)는 별도 지표로 표시합니다.
  en: >-
    Technical and operational readiness for search engines to discover, crawl, interpret
    and serve the site. It is not a rank prediction; observed search performance is reported separately.
  is_rank_prediction: false

changelog:
  - version: 1.0.0
    date: "2026-07-28"
    summary: >-
      최초 발행. SEO_RESEARCH_KIT/07_audit_tools/RECOMMENDED_SCORING_MODEL.md v0.1의
      카테고리 가중치·심각도 계수·사이트 전역 상한·URL 중요도를 그대로 채택하고,
      N/A 분모 재정규화와 unknown 신뢰도 반영 규칙을 명시화.

severity_coefficients:
  BLOCKER: 1.00
  CRITICAL: 0.60
  MAJOR: 0.30
  MINOR: 0.10
  INFO: 0.00

confidence_levels:
  DIRECT_OBSERVATION: 1.0
  OFFICIAL_API: 0.9
  HEURISTIC_HIGH: 0.8
  HEURISTIC_MEDIUM: 0.65
  HEURISTIC_LOW: 0.5
  EXTERNAL_ESTIMATE: 0.4

status_policy:
  fail_penalty_multiplier: 1.0
  warning_penalty_multiplier: 0.5
  pass_penalty_multiplier: 0.0
  not_applicable: EXCLUDE_FROM_DENOMINATOR
  unknown: EXCLUDE_FROM_SCORE_REDUCE_COVERAGE

url_importance:
  CONVERSION_OR_HOME: 3.0
  CATEGORY_OR_HUB: 2.0
  CONTENT_OR_PRODUCT: 1.0
  TAG_OR_FILTER: 0.5
  INTENTIONAL_NOINDEX: 0.0

categories:
  - id: crawl_indexability
    weight: 25
    name_ko: 크롤링·색인 가능성
    name_en: Crawl & Indexability
    description_ko: 검색엔진이 URL을 가져오고 색인할 수 있는지에 대한 검사입니다.
    checks:
      - id: seo.http.status_ok
        title_ko: HTTP 상태 코드가 정상(2xx)인가
        title_en: HTTP status is successful
        severity: BLOCKER
        scope: URL
        remediation_owner: DEVELOPER
        evidence_required: [http_response]
        engine_scope: [GENERIC]
      - id: seo.http.redirect_chain_sane
        title_ko: 리다이렉트 체인이 짧고 루프가 없는가
        title_en: Redirect chain is short and loop-free
        severity: MAJOR
        scope: URL
        remediation_owner: DEVELOPER
        evidence_required: [http_response, redirect_chain]
      - id: seo.robots.txt_allows_url
        title_ko: robots.txt가 대상 URL의 크롤링을 허용하는가
        title_en: robots.txt allows crawling of the URL
        severity: BLOCKER
        scope: URL
        remediation_owner: DEVELOPER
        evidence_required: [robots_txt, matched_rule]
      - id: seo.robots.meta_indexable
        title_ko: meta robots / X-Robots-Tag가 색인을 막지 않는가
        title_en: meta robots or X-Robots-Tag does not block indexing
        severity: BLOCKER
        scope: URL
        remediation_owner: DEVELOPER
        applicability_ko: 의도된 noindex 페이지는 해당 없음으로 처리합니다.
        evidence_required: [http_headers, dom_snippet]
      - id: seo.canonical.declared_and_consistent
        title_ko: canonical이 선언되고 다른 신호와 일치하는가
        title_en: canonical is declared and consistent with other signals
        severity: CRITICAL
        scope: URL
        remediation_owner: DEVELOPER
        evidence_required: [dom_snippet, http_headers]
      - id: seo.canonical.not_cross_domain
        title_ko: canonical이 외부 도메인을 가리키지 않는가
        title_en: canonical does not point to an external domain
        severity: CRITICAL
        scope: URL
        remediation_owner: DEVELOPER
        evidence_required: [dom_snippet]
      - id: seo.sitemap.discoverable
        title_ko: sitemap을 robots.txt 또는 관례 경로에서 발견할 수 있는가
        title_en: sitemap is discoverable
        severity: MAJOR
        scope: SITE
        remediation_owner: DEVELOPER
        evidence_required: [robots_txt, http_response]
      - id: seo.sitemap.urls_valid
        title_ko: sitemap의 URL이 색인 가능한 정상 URL인가
        title_en: sitemap URLs are valid and indexable
        severity: MAJOR
        scope: SITE
        remediation_owner: DEVELOPER
        evidence_required: [sitemap_document, http_response]
      - id: seo.crawl.no_orphan_key_pages
        title_ko: 주요 페이지가 내부 링크로 도달 가능한가
        title_en: key pages are reachable through internal links
        severity: MAJOR
        scope: SITE
        remediation_owner: DEVELOPER
        evidence_required: [link_graph]
      - id: seo.crawl.no_broken_internal_links
        title_ko: 내부 링크에 4xx/5xx 대상이 없는가
        title_en: internal links do not target 4xx/5xx
        severity: MINOR
        scope: SITE
        remediation_owner: DEVELOPER
        evidence_required: [link_graph, http_response]

  - id: onpage_semantics
    weight: 15
    name_ko: 온페이지 시맨틱
    name_en: On-page Semantics
    checks:
      - id: seo.onpage.title_present_and_unique
        title_ko: title이 존재하고 중복되지 않는가
        title_en: title exists and is unique
        severity: CRITICAL
        scope: URL
        remediation_owner: MARKETER
        evidence_required: [dom_snippet]
      - id: seo.onpage.meta_description_quality
        title_ko: meta description이 존재하고 중복·길이 문제가 없는가
        title_en: meta description exists without duplication or length issues
        severity: MINOR
        scope: URL
        remediation_owner: MARKETER
        evidence_required: [dom_snippet]
      - id: seo.onpage.single_meaningful_h1
        title_ko: 의미 있는 H1이 하나 있는가
        title_en: exactly one meaningful H1 exists
        severity: MAJOR
        scope: URL
        remediation_owner: MARKETER
        evidence_required: [dom_snippet]
      - id: seo.onpage.heading_hierarchy
        title_ko: 제목 계층이 논리적으로 구성됐는가
        title_en: heading hierarchy is logical
        severity: MINOR
        scope: URL
        remediation_owner: MARKETER
        evidence_required: [dom_snippet]
      - id: seo.onpage.html_lang_declared
        title_ko: html lang 속성이 선언됐는가
        title_en: html lang attribute is declared
        severity: MINOR
        scope: URL
        remediation_owner: DEVELOPER
        evidence_required: [dom_snippet]
      - id: seo.onpage.image_alt_coverage
        title_ko: 의미 있는 이미지에 alt가 제공되는가
        title_en: meaningful images provide alt text
        severity: MINOR
        scope: URL
        remediation_owner: MARKETER
        applicability_ko: 이미지가 없는 페이지는 해당 없음입니다.
        evidence_required: [dom_snippet]
      - id: seo.onpage.descriptive_anchor_text
        title_ko: 내부 링크의 앵커 텍스트가 설명적인가
        title_en: internal anchor text is descriptive
        severity: MINOR
        scope: SITE
        remediation_owner: MARKETER
        evidence_required: [link_graph]
      - id: seo.onpage.no_duplicate_metadata
        title_ko: title/description이 사이트 내에서 중복되지 않는가
        title_en: title and description are not duplicated across the site
        severity: MAJOR
        scope: SITE
        remediation_owner: MARKETER
        evidence_required: [dom_snippet]

  - id: content_architecture
    weight: 15
    name_ko: 콘텐츠·정보구조
    name_en: Content & Information Architecture
    checks:
      - id: seo.content.no_thin_signal
        title_ko: 주요 페이지에 실질 콘텐츠가 충분한가
        title_en: key pages carry substantive content
        severity: MAJOR
        scope: SITE
        remediation_owner: MARKETER
        evidence_required: [text_extract]
      - id: seo.content.no_duplicate_bodies
        title_ko: 본문 중복·근접 중복이 과도하지 않은가
        title_en: body content is not excessively duplicated
        severity: MAJOR
        scope: SITE
        remediation_owner: MARKETER
        evidence_required: [text_extract, similarity_matrix]
      - id: seo.content.click_depth_reasonable
        title_ko: 주요 페이지의 클릭 깊이가 과도하지 않은가
        title_en: click depth to key pages is reasonable
        severity: MINOR
        scope: SITE
        remediation_owner: DEVELOPER
        evidence_required: [link_graph]
      - id: seo.content.internal_link_density
        title_ko: 주제 클러스터 내부 링크가 충분한가
        title_en: topical internal linking is sufficient
        severity: MINOR
        scope: SITE
        remediation_owner: MARKETER
        evidence_required: [link_graph]
      - id: seo.content.pagination_signals
        title_ko: 페이지네이션 신호가 올바른가
        title_en: pagination signals are correct
        severity: MINOR
        scope: SITE
        remediation_owner: DEVELOPER
        applicability_ko: 페이지네이션이 없는 사이트는 해당 없음입니다.
        evidence_required: [dom_snippet]
      - id: seo.content.breadcrumb_present
        title_ko: 계층이 깊은 사이트에 breadcrumb이 제공되는가
        title_en: breadcrumbs are provided on deep hierarchies
        severity: MINOR
        scope: SITE
        remediation_owner: DEVELOPER
        applicability_ko: 계층이 얕은 사이트는 해당 없음입니다.
        evidence_required: [dom_snippet]
      - id: seo.content.js_render_parity
        title_ko: JS 렌더링 전후 핵심 콘텐츠가 일치하는가
        title_en: core content matches before and after JS rendering
        severity: CRITICAL
        scope: URL
        remediation_owner: DEVELOPER
        evidence_required: [raw_html, rendered_dom]

  - id: performance_ux
    weight: 15
    name_ko: 성능·사용자 경험
    name_en: Performance & UX
    description_ko: Lighthouse lab 값과 CrUX field 값은 절대 같은 지표로 합치지 않습니다.
    checks:
      - id: seo.perf.lcp_lab
        title_ko: LCP(lab)가 기준 이내인가
        title_en: LCP (lab) is within threshold
        severity: MAJOR
        scope: URL
        remediation_owner: DEVELOPER
        evidence_required: [lighthouse_run]
      - id: seo.perf.cls_lab
        title_ko: CLS(lab)가 기준 이내인가
        title_en: CLS (lab) is within threshold
        severity: MINOR
        scope: URL
        remediation_owner: DEVELOPER
        evidence_required: [lighthouse_run]
      - id: seo.perf.tbt_lab
        title_ko: TBT(lab)가 기준 이내인가
        title_en: TBT (lab) is within threshold
        severity: MINOR
        scope: URL
        remediation_owner: DEVELOPER
        evidence_required: [lighthouse_run]
      - id: seo.perf.inp_field
        title_ko: INP(field, CrUX)가 기준 이내인가
        title_en: INP (field, CrUX) is within threshold
        severity: MAJOR
        scope: URL
        remediation_owner: DEVELOPER
        applicability_ko: CrUX 표본이 없는 URL은 해당 없음입니다.
        evidence_required: [crux_record]
        engine_scope: [GOOGLE]
      - id: seo.ux.mobile_viewport
        title_ko: 모바일 viewport가 올바르게 선언됐는가
        title_en: mobile viewport is declared correctly
        severity: CRITICAL
        scope: URL
        remediation_owner: DEVELOPER
        evidence_required: [dom_snippet]
      - id: seo.security.https_valid
        title_ko: HTTPS가 유효하고 인증서 문제가 없는가
        title_en: HTTPS is valid without certificate problems
        severity: CRITICAL
        scope: SITE
        remediation_owner: DEVELOPER
        evidence_required: [tls_handshake]
      - id: seo.security.no_mixed_content
        title_ko: 혼합 콘텐츠가 없는가
        title_en: no mixed content is loaded
        severity: MAJOR
        scope: URL
        remediation_owner: DEVELOPER
        evidence_required: [rendered_dom, network_log]

  - id: structured_data
    weight: 10
    name_ko: 구조화 데이터
    name_en: Structured Data
    checks:
      - id: seo.sd.jsonld_parses
        title_ko: JSON-LD가 문법적으로 파싱되는가
        title_en: JSON-LD parses without syntax errors
        severity: MAJOR
        scope: URL
        remediation_owner: DEVELOPER
        applicability_ko: 구조화 데이터가 없는 페이지는 해당 없음이며 감점하지 않습니다.
        evidence_required: [dom_snippet]
      - id: seo.sd.required_properties_present
        title_ko: 선언한 타입의 필수 속성이 있는가
        title_en: required properties of the declared type are present
        severity: MAJOR
        scope: URL
        remediation_owner: DEVELOPER
        applicability_ko: 구조화 데이터가 없는 페이지는 해당 없음입니다.
        evidence_required: [dom_snippet, validator_output]
      - id: seo.sd.matches_visible_content
        title_ko: 구조화 데이터가 화면에 보이는 내용과 일치하는가
        title_en: structured data matches visible content
        severity: CRITICAL
        scope: URL
        remediation_owner: DEVELOPER
        applicability_ko: 구조화 데이터가 없는 페이지는 해당 없음입니다.
        evidence_required: [dom_snippet, text_extract]
      - id: seo.sd.google_supported_type
        title_ko: Google이 지원하는 리치 결과 타입인가
        title_en: type is supported by Google rich results
        severity: MINOR
        scope: URL
        remediation_owner: DEVELOPER
        applicability_ko: 구조화 데이터가 없는 페이지는 해당 없음입니다.
        engine_scope: [GOOGLE]
        evidence_required: [validator_output]
      - id: seo.sd.naver_supported_type
        title_ko: 네이버가 인식하는 형식 요건을 충족하는가
        title_en: meets Naver-recognised structured data requirements
        severity: MINOR
        scope: URL
        remediation_owner: DEVELOPER
        applicability_ko: 네이버 대상이 아닌 사이트는 해당 없음입니다.
        engine_scope: [NAVER]
        evidence_required: [validator_output]

  - id: search_engine_integration
    weight: 10
    name_ko: 검색엔진 연동
    name_en: Search Engine Integration
    description_ko: 연동 자격증명이 없으면 unknown으로 기록하고 실패로 판정하지 않습니다.
    checks:
      - id: seo.integration.gsc_verified
        title_ko: Google Search Console 소유권이 확인됐는가
        title_en: Google Search Console ownership is verified
        severity: MAJOR
        scope: SITE
        remediation_owner: OPERATIONS
        engine_scope: [GOOGLE]
        evidence_required: [provider_response]
      - id: seo.integration.naver_swa_registered
        title_ko: 네이버 서치어드바이저에 사이트가 등록됐는가
        title_en: site is registered in Naver Search Advisor
        severity: MAJOR
        scope: SITE
        remediation_owner: OPERATIONS
        engine_scope: [NAVER]
        evidence_required: [provider_response]
      - id: seo.integration.sitemap_submitted
        title_ko: sitemap이 검색엔진에 제출되고 처리됐는가
        title_en: sitemap is submitted and processed
        severity: MINOR
        scope: SITE
        remediation_owner: OPERATIONS
        evidence_required: [provider_response]
      - id: seo.integration.indexnow_configured
        title_ko: IndexNow 등 변경 통지가 구성됐는가
        title_en: change notification such as IndexNow is configured
        severity: INFO
        scope: SITE
        remediation_owner: DEVELOPER
        evidence_required: [http_response]

  - id: observability_outcomes
    weight: 5
    name_ko: 관측·성과
    name_en: Observability & Outcomes
    description_ko: 검색 성과 데이터는 기술 준비도와 분리해 표시하며, 연동이 없으면 unknown입니다.
    checks:
      - id: seo.outcome.impressions_available
        title_ko: 노출 데이터가 수집되고 있는가
        title_en: impression data is being collected
        severity: MINOR
        scope: SITE
        remediation_owner: OPERATIONS
        evidence_required: [provider_response]
      - id: seo.outcome.index_coverage_healthy
        title_ko: 색인 커버리지에 급격한 악화가 없는가
        title_en: index coverage shows no sharp deterioration
        severity: MAJOR
        scope: SITE
        remediation_owner: OPERATIONS
        evidence_required: [provider_response]
      - id: seo.outcome.data_freshness
        title_ko: 성과 데이터의 최신성이 확보됐는가
        title_en: performance data is sufficiently fresh
        severity: MINOR
        scope: SITE
        remediation_owner: OPERATIONS
        evidence_required: [provider_response]

  - id: offpage_entity
    weight: 5
    name_ko: 오프페이지·엔터티 신호
    name_en: Off-page & Entity Signals
    checks:
      - id: seo.offpage.referring_domains_present
        title_ko: 참조 도메인이 존재하는가
        title_en: referring domains exist
        severity: MINOR
        scope: SITE
        remediation_owner: MARKETER
        evidence_required: [provider_response]
      - id: seo.offpage.brand_name_consistency
        title_ko: 브랜드 표기가 외부 채널과 일치하는가
        title_en: brand naming is consistent across external channels
        severity: MINOR
        scope: SITE
        remediation_owner: MARKETER
        evidence_required: [external_source]
      - id: seo.offpage.no_spam_signal
        title_ko: 명백한 스팸 링크 신호가 없는가
        title_en: no obvious spam link signals
        severity: MAJOR
        scope: SITE
        remediation_owner: MARKETER
        evidence_required: [provider_response]

caps:
  - id: sitewide_index_block
    max_overall_score: 25
    reason_ko: 홈페이지 또는 사이트 전체가 robots 또는 noindex로 색인 차단되어 있습니다.
    release_condition_ko: 차단 규칙을 제거하고 재검증하면 상한이 자동 해제됩니다.
    trigger:
      any_of:
        - check_id: seo.robots.txt_allows_url
          status: FAIL
          min_coverage: 0.9
        - check_id: seo.robots.meta_indexable
          status: FAIL
          min_coverage: 0.9
  - id: key_template_server_error
    max_overall_score: 35
    reason_ko: 주요 템플릿이 5xx이거나 렌더링되지 않습니다.
    release_condition_ko: 해당 템플릿이 2xx로 응답하고 핵심 콘텐츠가 렌더링되면 해제됩니다.
    trigger:
      any_of:
        - check_id: seo.http.status_ok
          status: FAIL
          min_coverage: 0.3
        - check_id: seo.content.js_render_parity
          status: FAIL
          min_coverage: 0.5
  - id: mass_cross_domain_canonical
    max_overall_score: 40
    reason_ko: 다수 URL의 canonical이 다른 도메인을 가리킵니다.
    release_condition_ko: canonical을 자사 도메인으로 정정하고 재검증하면 해제됩니다.
    trigger:
      any_of:
        - check_id: seo.canonical.not_cross_domain
          status: FAIL
          min_coverage: 0.5
  - id: sitemap_majority_invalid
    max_overall_score: 55
    reason_ko: sitemap에 등록된 URL의 과반이 비정상이거나 색인 불가입니다.
    release_condition_ko: sitemap을 정리해 유효 URL 비중을 과반 이상으로 올리면 해제됩니다.
    trigger:
      any_of:
        - check_id: seo.sitemap.urls_valid
          status: FAIL
          min_coverage: 0.5
  - id: https_or_mobile_failure
    max_overall_score: 60
    reason_ko: HTTPS 또는 모바일 접근에 중대한 실패가 있습니다.
    release_condition_ko: 인증서와 모바일 viewport 문제를 해결하면 해제됩니다.
    trigger:
      any_of:
        - check_id: seo.security.https_valid
          status: FAIL
        - check_id: seo.ux.mobile_viewport
          status: FAIL
          min_coverage: 0.5

bands:
  - id: ready
    min: 90
    max: 100
    label_ko: 준비 완료
