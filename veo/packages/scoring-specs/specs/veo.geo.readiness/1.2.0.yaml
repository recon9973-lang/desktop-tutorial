# VEO GEO Readiness Scoring Specification
# Methodology: VEO-LAB / Implementation: VENOM
#
# IMPORTANT: This specification scores READINESS only — whether a page can be reached,
# extracted and verified by AI answer engines. Observed AI visibility (mention rate,
# citation rate, share of voice) is a MEASUREMENT, never merged into this score.
spec_id: veo.geo.readiness
domain: GEO_READINESS
version: 1.2.0
status: PUBLISHED
effective_at: "2026-07-31T12:00:00+09:00"
methodology_owner: VEO-LAB
implementation_owner: VENOM
approved_by: VEO-LAB
compatible_collector_versions:
  - "geo-readiness-collector/1.x"

score_meaning:
  ko: >-
    AI 답변 엔진이 페이지에 접근하고, 답변에 쓸 수 있게 내용을 추출하고,
    근거와 엔터티를 검증할 수 있는 구조적 준비도입니다.
    실제 AI 노출·인용 여부는 이 점수가 아니라 별도의 AI 가시성 관측 결과로만 확인합니다.
  en: >-
    Structural readiness for AI answer engines to access, extract and verify a page.
    Actual AI mentions and citations are reported only by the separate observation engine.
  is_rank_prediction: false

changelog:
  - version: 1.2.0
    date: "2026-07-31"
    summary: >-
      **점수는 그대로. 바뀐 것은 왜 빠졌는지 적는 말뿐이다.**
      1.1.0 은 외부 검증 네 항목을 `PAID_PROVIDER`(유료 데이터원 필요)로 적었는데
      사실이 아니었다. 실측해 보니 이미 가진 네이버 자격증명으로 지역·블로그·뉴스·
      웹문서 검색이 전부 열린다 — 돈 문제가 아니다.
      그렇다고 점수에 넣을 수도 없다. 네이버 한 곳만 보는 것이고, 이름이 비슷한 다른
      업체의 글을 고객 것으로 셀 위험이 있다. 그래서 `REFERENCE_ONLY` 를 새로 두고
      **"참고 · 별도 확인 필요"** 로 적는다 — 보여는 주되 점수로 확정하지 않는다.
      "유료 서비스가 필요합니다" 라고 적으면 우리 쪽 한계를 고객이 돈으로 풀어야 할
      일처럼 넘기게 된다(0-A: 우리가 못 잰 것과 고객이 권한을 안 준 것을 구분한다).
  - version: 1.1.0
    date: "2026-07-31"
    summary: >-
      **절대 평가로 옮긴다.** 1.0.0 은 못 잰 항목을 분모에서 빼는 상대 평가였다 —
      SEO 는 1.2.0 에서 이미 옮겼는데 GEO 만 남아 있었고, 그것을 검사하는 코드가
      없어서 다섯 달 동안 아무도 몰랐다. 그 상태에서는 적게 잴수록 점수가 올랐다.
      실측 www.seokorea.org 79.86(분모 90) → 71.88(분모 100).
      함께 `external_verifiability`(외부 검증 가능성, 배점 10)를 점수 밖으로 옮긴다.
      네 항목 모두 외부 출처 데이터가 있어야 잴 수 있는데 그 수집 경로가 아직 없다 —
      선언만 해 두면 우리가 안 만든 기능 때문에 모든 고객의 점수가 내려간다.
      나머지 여섯 영역을 100 으로 재조정했다(영역 간 비율은 그대로).
      이 영역은 사라지지 않고 "이 진단의 배점 밖" 으로 사유와 함께 계속 보고된다.
  - version: 1.0.0
    date: "2026-07-28"
    summary: >-
      최초 발행. GEO_RESEARCH_KIT/06_measurement/RECOMMENDED_GEO_SCORING_MODEL.md의
      7개 영역 배점과 치명적 게이트 규칙을 채택. 학습용 봇 차단은 감점 대상에서 제외.

severity_coefficients:
  BLOCKER: 1.00
  CRITICAL: 0.60
  MAJOR: 0.30
  MINOR: 0.10
  INFO: 0.00

confidence_levels:
  DIRECT_OBSERVATION: 1.0
  OFFICIAL_API: 0.9
  HEURISTIC_HIGH: 0.8
  HEURISTIC_MEDIUM: 0.65
  HEURISTIC_LOW: 0.5
  EXTERNAL_ESTIMATE: 0.4

status_policy:
  fail_penalty_multiplier: 1.0
  warning_penalty_multiplier: 0.5
  pass_penalty_multiplier: 0.0
  not_applicable: EXCLUDE_FROM_DENOMINATOR
  unknown: SCORE_AS_ZERO_KEEP_IN_DENOMINATOR

url_importance:
  CONVERSION_OR_HOME: 3.0
  CATEGORY_OR_HUB: 2.0
  CONTENT_OR_PRODUCT: 1.0
  TAG_OR_FILTER: 0.5
  INTENTIONAL_NOINDEX: 0.0

categories:
  - id: access_eligibility
    weight: 22.22
    name_ko: 접근·검색 적격성
    name_en: Access & Search Eligibility
    description_ko: 검색용 크롤러 차단만 평가합니다. 학습용 크롤러 차단은 정책 선택이며 감점하지 않습니다.
    checks:
      - id: geo.access.http_status_ok
        title_ko: HTTP 상태가 정상인가
        title_en: HTTP status is successful
        severity: BLOCKER
        scope: URL
        remediation_owner: DEVELOPER
        evidence_required: [http_response]
      - id: geo.access.no_auth_required
        title_ko: 인증 없이 콘텐츠에 접근할 수 있는가
        title_en: content is reachable without authentication
        severity: BLOCKER
        scope: URL
        remediation_owner: DEVELOPER
        evidence_required: [http_response]
      - id: geo.access.indexable
        title_ko: noindex로 검색 적격성이 차단되지 않았는가
        title_en: page is not blocked from indexing
        severity: BLOCKER
        scope: URL
        remediation_owner: DEVELOPER
        applicability_ko: 의도된 noindex 페이지는 해당 없음입니다.
        evidence_required: [http_headers, dom_snippet]
      - id: geo.access.search_bots_allowed
        title_ko: 검색용 AI 크롤러가 robots.txt에서 허용되는가
        title_en: search-purpose AI crawlers are allowed in robots.txt
        severity: CRITICAL
        scope: SITE
        remediation_owner: DEVELOPER
        engine_scope: [AI_ANSWER_ENGINE]
        evidence_required: [robots_txt, matched_rule]
      - id: geo.access.training_bot_policy_declared
        title_ko: 학습용 크롤러 정책이 의도적으로 선언됐는가
        title_en: training-crawler policy is intentionally declared
        severity: INFO
        scope: SITE
        remediation_owner: BUSINESS_OWNER
        reference_ko: 학습 차단은 사업 선택이므로 감점하지 않고 정보로만 표시합니다.
        evidence_required: [robots_txt]
      - id: geo.access.not_blocked_by_edge
        title_ko: WAF/CDN이 정상 크롤러를 차단하지 않는가
        title_en: WAF or CDN does not block legitimate crawlers
        severity: CRITICAL
        scope: SITE
        remediation_owner: DEVELOPER
        evidence_required: [http_response, http_headers]
      - id: geo.access.content_visible_without_js
        title_ko: 핵심 콘텐츠가 JS 없이도 제공되는가
        title_en: core content is available without JavaScript execution
        severity: MAJOR
        scope: URL
        remediation_owner: DEVELOPER
        evidence_required: [raw_html, rendered_dom]

  - id: answer_extractability
    weight: 22.22
    name_ko: 답변 추출성
    name_en: Answer Extractability
    checks:
      - id: geo.extract.direct_answer_present
        title_ko: 핵심 질문에 대한 직접적인 답변 문단이 있는가
        title_en: a direct answer passage exists
        severity: CRITICAL
        scope: URL
        remediation_owner: MARKETER
        evidence_required: [text_extract]
      - id: geo.extract.passage_self_contained
        title_ko: 발췌 문단이 문맥 없이도 이해되는가
        title_en: passages are self-contained
        severity: MAJOR
        scope: URL
        remediation_owner: MARKETER
        evidence_required: [text_extract]
      - id: geo.extract.heading_structure_semantic
        title_ko: 제목 구조가 질문·주제 단위로 나뉘어 있는가
        title_en: heading structure segments topics and questions
        severity: MAJOR
        scope: URL
        remediation_owner: MARKETER
        evidence_required: [dom_snippet]
      - id: geo.extract.tables_lists_machine_readable
        title_ko: 비교·수치 정보가 표·목록으로 구조화됐는가
        title_en: comparative or numeric information is structured as tables or lists
        severity: MINOR
        scope: URL
        remediation_owner: MARKETER
        applicability_ko: 비교·수치 정보가 없는 페이지는 해당 없음입니다.
        evidence_required: [dom_snippet]
      - id: geo.extract.low_boilerplate_ratio
        title_ko: 보일러플레이트 대비 본문 비중이 충분한가
        title_en: main content outweighs boilerplate
        severity: MAJOR
        scope: URL
        remediation_owner: DEVELOPER
        evidence_required: [text_extract]
      - id: geo.extract.no_duplicate_answer_blocks
        title_ko: 같은 답변 블록이 여러 URL에 중복되지 않는가
        title_en: answer blocks are not duplicated across URLs
        severity: MINOR
        scope: SITE
        remediation_owner: MARKETER
        evidence_required: [text_extract, similarity_matrix]

  - id: evidence_transparency
    weight: 16.67
    name_ko: 근거·출처 투명성
    name_en: Evidence & Source Transparency
    checks:
      - id: geo.evidence.claims_have_sources
        title_ko: 검증이 필요한 주장에 출처가 연결되는가
        title_en: verifiable claims are linked to sources
        severity: CRITICAL
        scope: URL
        remediation_owner: MARKETER
        evidence_required: [text_extract, link_graph]
      - id: geo.evidence.author_identified
        title_ko: 작성자 또는 감수자가 식별되는가
        title_en: an author or reviewer is identified
        severity: MAJOR
        scope: URL
        remediation_owner: MARKETER
        applicability_ko: 작성자 표기가 필요 없는 페이지 유형은 해당 없음입니다.
        evidence_required: [dom_snippet]
      - id: geo.evidence.publisher_identified
        title_ko: 발행 주체와 연락 경로가 확인되는가
        title_en: the publisher and a contact path are identifiable
        severity: MAJOR
        scope: SITE
        remediation_owner: BUSINESS_OWNER
        evidence_required: [dom_snippet]
      - id: geo.evidence.method_disclosed
        title_ko: 수치·비교의 산출 방법이 공개되는가
        title_en: the method behind figures and comparisons is disclosed
        severity: MINOR
        scope: URL
        remediation_owner: MARKETER
        applicability_ko: 자체 수치나 비교가 없는 페이지는 해당 없음입니다.
        evidence_required: [text_extract]
      - id: geo.evidence.primary_source_linked
        title_ko: 2차 인용 대신 원출처가 연결되는가
        title_en: primary sources are linked instead of second-hand citations
        severity: MINOR
        scope: URL
        remediation_owner: MARKETER
        applicability_ko: 외부 출처 인용이 없는 페이지는 해당 없음입니다.
        evidence_required: [link_graph]

  - id: entity_clarity
    weight: 16.67
    name_ko: 엔터티 명확성·일관성
    name_en: Entity Clarity & Consistency
    checks:
      - id: geo.entity.organization_identified
        title_ko: 조직 엔터티가 명확히 식별되는가
        title_en: the organization entity is clearly identified
        severity: CRITICAL
        scope: SITE
        remediation_owner: MARKETER
        evidence_required: [dom_snippet, text_extract]
      - id: geo.entity.stable_id_graph
        title_ko: 구조화 데이터의 @id가 엔터티 간에 연결되는가
        title_en: structured data @id values connect the entity graph
        severity: MAJOR
        scope: SITE
        remediation_owner: DEVELOPER
        applicability_ko: 구조화 데이터를 사용하지 않는 사이트는 해당 없음입니다.
        evidence_required: [dom_snippet]
      - id: geo.entity.sameas_profiles_present
        title_ko: sameAs로 공식 외부 프로필이 연결되는가
        title_en: sameAs links official external profiles
        severity: MINOR
        scope: SITE
        remediation_owner: MARKETER
        evidence_required: [dom_snippet]
      - id: geo.entity.name_consistent_across_pages
        title_ko: 브랜드·지점·제품 명칭이 사이트 전체에서 일관되는가
        title_en: brand, branch and product naming is consistent site-wide
        severity: MAJOR
        scope: SITE
        remediation_owner: MARKETER
        evidence_required: [text_extract]
      - id: geo.entity.nap_consistent
        title_ko: 상호·주소·연락처가 공식 정보와 일치하는가
        title_en: name, address and contact match official records
        severity: CRITICAL
        scope: SITE
        remediation_owner: BUSINESS_OWNER
        applicability_ko: 오프라인 거점이 없는 사업자는 해당 없음입니다.
        evidence_required: [dom_snippet, external_source]
      - id: geo.entity.disambiguation_signals
        title_ko: 동명 브랜드와 구분되는 신호가 있는가
        title_en: signals distinguish the brand from same-name entities
        severity: MINOR
        scope: SITE
        remediation_owner: MARKETER
        evidence_required: [text_extract, external_source]

  - id: structured_data_meta
    weight: 11.11
    name_ko: 구조화 데이터·메타
    name_en: Structured Data & Meta
    description_ko: schema 부재 자체는 치명적 오류가 아닙니다. 화면과 불일치하는 허위 schema는 위험으로 처리합니다.
    checks:
      - id: geo.sd.valid_syntax
        title_ko: 구조화 데이터가 유효하게 파싱되는가
        title_en: structured data parses and validates
        severity: MAJOR
        scope: URL
        remediation_owner: DEVELOPER
        applicability_ko: 구조화 데이터가 없으면 해당 없음이며 감점하지 않습니다.
        evidence_required: [dom_snippet, validator_output]
      - id: geo.sd.matches_visible_content
        title_ko: 구조화 데이터가 화면 내용과 일치하는가
        title_en: structured data matches visible content
        severity: BLOCKER
        scope: URL
        remediation_owner: DEVELOPER
        applicability_ko: 구조화 데이터가 없으면 해당 없음입니다.
        reference_ko: 허위 schema는 GEO 위험 항목입니다.
        evidence_required: [dom_snippet, text_extract]
      - id: geo.sd.page_type_appropriate
        title_ko: 페이지 의도에 맞는 타입을 사용하는가
        title_en: the declared type suits the page intent
        severity: MINOR
        scope: URL
        remediation_owner: DEVELOPER
        applicability_ko: 구조화 데이터가 없으면 해당 없음입니다.
        evidence_required: [dom_snippet]
      - id: geo.meta.title_description_descriptive
        title_ko: title과 description이 페이지 내용을 정확히 설명하는가
        title_en: title and description describe the page accurately
        severity: MINOR
        scope: URL
        remediation_owner: MARKETER
        evidence_required: [dom_snippet]
      - id: geo.meta.opengraph_present
        title_ko: 공유용 메타데이터가 제공되는가
        title_en: sharing metadata is provided
        severity: INFO
        scope: URL
        remediation_owner: DEVELOPER
        evidence_required: [dom_snippet]

  - id: freshness_signals
    weight: 11.11
    name_ko: 최신성·변경 신호
    name_en: Freshness & Change Signals
    checks:
      - id: geo.fresh.dates_present
        title_ko: 발행일과 수정일이 표시되는가
        title_en: published and modified dates are present
        severity: MAJOR
        scope: URL
        remediation_owner: DEVELOPER
        applicability_ko: 날짜 표기가 부적절한 페이지 유형은 해당 없음입니다.
        evidence_required: [dom_snippet]
      - id: geo.fresh.dates_truthful
        title_ko: 표시된 수정일이 실제 변경과 일치하는가
        title_en: the modified date reflects real changes
        severity: CRITICAL
        scope: URL
        remediation_owner: DEVELOPER
        applicability_ko: 날짜가 없으면 해당 없음입니다.
        reference_ko: 내용 변경 없이 날짜만 갱신하는 것은 신뢰를 훼손합니다.
        evidence_required: [dom_snippet, content_hash_history]
      - id: geo.fresh.sitemap_lastmod_reliable
        title_ko: sitemap lastmod가 신뢰 가능한가
        title_en: sitemap lastmod is reliable
        severity: MINOR
        scope: SITE
        remediation_owner: DEVELOPER
        applicability_ko: sitemap이 없으면 해당 없음입니다.
        evidence_required: [sitemap_document]
      - id: geo.fresh.no_stale_claims
        title_ko: 가격·정책·영업정보 등 시간 민감 정보가 최신인가
        title_en: time-sensitive information is up to date
        severity: MAJOR
        scope: URL
        remediation_owner: BUSINESS_OWNER
        evidence_required: [text_extract]

  - id: external_verifiability
    weight: 10
    contributes_to_score: false
    name_ko: 외부 검증 가능성
    name_en: External Verifiability
    description_ko: >-
      **참고 항목입니다. 점수에 반영되지 않습니다.**
      다른 사이트에서 이 사업자가 어떻게 언급되는지를 보는 영역입니다. 네이버 검색으로
      상당 부분 조회할 수 있지만, 두 가지 한계 때문에 점수로 확정하지 않습니다 —
      국내 검색 한 곳만 보는 것이라 웹 전체를 대표하지 못하고, 이름이 비슷한 다른
      업체의 글이 섞일 수 있습니다. 잘못 센 평판은 없는 사실을 만들어 냅니다.
      그래서 조회 결과는 보여드리되 **눈으로 한 번 확인**해 주셔야 합니다.
    checks:
      - id: geo.external.independent_sources_exist
        title_ko: 독립적인 외부 출처에서 확인되는가
        title_en: independent external sources corroborate the entity
        severity: MAJOR
        scope: SITE
        remediation_owner: MARKETER
        availability: REFERENCE_ONLY
        evidence_required: [external_source]
      - id: geo.external.official_profiles_claimed
        title_ko: 공식 프로필이 확보·정비돼 있는가
        title_en: official profiles are claimed and maintained
        severity: MAJOR
        scope: SITE
        remediation_owner: MARKETER
        availability: REFERENCE_ONLY
        evidence_required: [external_source]
      - id: geo.external.source_type_diversity
        title_ko: 출처 유형이 다양한가
        title_en: corroborating sources are diverse in type
        severity: MINOR
        scope: SITE
        remediation_owner: MARKETER
        availability: REFERENCE_ONLY
        evidence_required: [external_source]
      - id: geo.external.facts_agree_across_sources
        title_ko: 외부 출처의 핵심 사실이 자사 정보와 일치하는가
        title_en: key facts agree across external sources
        severity: CRITICAL
        scope: SITE
        remediation_owner: BUSINESS_OWNER
        availability: REFERENCE_ONLY
        evidence_required: [external_source, text_extract]

# Gates never change the numeric score. They surface a separate status beside it.
gates:
  - id: exposure_blocked_http
    status_code: EXPOSURE_BLOCKED
    label_ko: 노출 차단 — 응답 오류
    label_en: Exposure blocked — HTTP error
    description_ko: 대상 URL이 4xx/5xx를 반환하므로 AI 답변 엔진이 내용을 사용할 수 없습니다.
    trigger:
      any_of:
