# VEO 모델 가격표
#
# 관측 실행 비용을 계산하는 데만 쓰인다. 다른 어떤 것도 이 값에 의존하지 않는다.
#
# 왜 코드가 아니라 날짜가 붙은 파일인가:
#   모델 가격은 자주 바뀐다. 코드에 박아두면 다음 개정 때부터 조용히 틀린 값이 되고,
#   틀린 가격을 비용으로 표시하는 것은 이 제품이 만들지 않기로 한 종류의 그럴듯한
#   허구다. 그래서 이 표에는 기준일이 있고, 오래되면 비용이 '측정 불가'가 된다.
#   0원이 되지 않는다 — 모르는 것과 공짜인 것은 다르다.
#
# 갱신 방법:
#   새 파일을 오늘 날짜로 만들고 값을 넣는다. 기존 파일은 고치지 않는다.
#   과거 실행의 비용을 나중에 재현할 수 있어야 하기 때문이다.
#   (2026-07-28.yaml 은 값이 비어 있는 채로 남겨 둔다. 그날의 진실이 그것이었다.)
#
# ─────────────────────────────────────────────────────────────────────────────
# 이 판이 왜 필요했나 — 2026-08-08
#
#   빈 표는 안전한 기본값이 아니라 **관측을 못 돌게 막는 자물쇠**였다.
#   `runner.py:526` 은 예산 상한이 걸린 실행에서 비용을 못 재면 그 자리에서 멈춘다:
#
#       if result.cost_usd is None:
#           stopped = StopReason.COST_UNMEASURABLE
#
#   빈 표에서는 모든 호출의 비용이 None 이므로 **첫 호출에서 중단**된다. 상한을 안
#   걸면 돌기는 하지만, 그것은 거래처 8곳에 실제 돈을 쓰면서 얼마 나가는지 모르는
#   채로 도는 것이다. 둘 다 쓸 수 없는 상태였다.
#
#   그래서 값을 채운다. 다만 **확인한 값만** 넣는다. 근거의 등급이 둘로 갈린다:
#
#     [대조 2곳] gpt-5 · gpt-4o-mini
#         공식 가격표 페이지와 모델별 개별 페이지에서 각각 읽어 값이 같은 것을 확인.
#     [출처 1곳] 나머지
#         공식 가격표 페이지에서만 읽었다. 대조하지 않았다.
#
#   이 구분을 적어 두는 이유: 2026-08-08 실측으로 **검색 요약이 gpt-5 를 입력 $2.50 /
#   출력 $0.25 로 알려 왔다.** 실제는 $1.25 / $10.00 이다 — 입·출력이 뒤바뀌고 자릿수도
#   틀렸다. 그대로 넣었으면 실제 비용의 40분의 1을 예산으로 세고 상한을 넘겨 썼을
#   것이다. 한 곳에서 읽은 값은 그 사고를 막지 못한다.
#
#   [출처 1곳] 값을 실제로 쓰게 되는 날, 쓰기 전에 모델별 페이지로 대조하고 새 날짜의
#   파일에 [대조 2곳] 으로 옮긴다.
#
#   OpenAI 외 제공자(Anthropic·Gemini·Perplexity)는 **비워 둔다.** 지금 쓰는 열쇠가
#   OpenAI 하나뿐이라 실제로 부를 일이 없고, 확인하지 않은 값을 미리 채워 두면 나중에
#   그 열쇠가 붙는 날 아무도 다시 확인하지 않는다. 그때 이 파일 옆에 새 날짜로 넣는다.
# ─────────────────────────────────────────────────────────────────────────────

version: "model-prices/2026-08-08"
as_of: "2026-08-08"

# 이 날짜가 지나면 비용을 계산하지 않고 '가격표 만료'로 보고한다.
# 90일은 주요 제공자의 가격 개정 주기를 넉넉히 넘지 않는 선이다.
stale_after_days: 90

currency: USD

# 백만 토큰당 단가. 모델 버전이 있으면 버전 키가 우선하고, 없으면 모델 키로 떨어진다.
# (관측 기록의 model_version 은 `gpt-4o-mini-2024-07-18` 처럼 날짜가 붙은 실제 빌드라
#  여기에 없다 — 모델 키로 떨어져 계산된다. 값이 바뀐 날짜 빌드가 나오면 그 키를
#  따로 적는다.)
#
# 확인하지 않은 값은 넣지 않는다. 비어 있는 편이 틀린 것보다 낫다.
prices:
  # ── 관측에 실제로 쓰는 것 ──────────────────────────────────────────────────
  # 인용(citation)을 돌려주는 모델은 gpt-4o 계열과 gpt-5 계열뿐이다
  # (`providers/openai.py` CITATION_CAPABLE_MODEL_PREFIXES). gpt-4o-mini 는
  # 웹 검색을 실행하고도 인용을 0개 돌려준 것이 실측돼 있다 — 싸다고 그것을 쓰면
  # "우리 사이트가 한 번도 인용되지 않았다" 는 거짓 결론이 나온다.
  gpt-5:
    input_usd_per_million: 1.25
    output_usd_per_million: 10.00
    # 추론 모델의 웹 검색 요금. 검색으로 딸려온 토큰도 함께 과금되므로 입력 토큰을
    # 그대로 세면 된다 — 금액이 정확히 나온다.
    search_usd_per_1k_calls: 10.00
    source_url: "https://developers.openai.com/api/docs/models/gpt-5"
    verified_on: "2026-08-08"
  gpt-4o:
    input_usd_per_million: 2.50
    output_usd_per_million: 10.00
    # 비추론 모델은 요금이 더 비싸고(=$25/1k), 대신 검색으로 딸려온 토큰이 **무료**다.
    # 그런데 제공자는 프롬프트 토큰과 검색 토큰을 합친 하나의 input_tokens 만 준다.
    # 가를 방법이 없으므로 **이 모델의 검색 호출은 금액을 낼 수 없다** —
    # 전부 과금으로 치면 과대, 전부 공짜로 치면 과소다. 지어내지 않는다.
    #
    # 실측 2026-08-08: 같은 질문에 입력 17,264 토큰. 이 중 얼마가 검색 결과인지
    # 응답 어디에도 없다.
    #
    # → 관측에는 gpt-5 를 쓴다. 금액이 정확히 나오는 쪽이다.
    search_usd_per_1k_calls: 25.00
    search_content_tokens_free: true
    source_url: "https://developers.openai.com/api/docs/pricing"
    verified_on: "2026-08-08"

  # ── 값싼 계열 · 인용을 안 주므로 관측 본체에는 쓰지 않는다 ─────────────────
  # 그래도 적어 두는 이유: 요약·분류 같은 보조 호출에 쓰였을 때 비용이 조용히
  # '측정 불가'가 되면, 실제로 돈을 쓴 호출이 예산 집계에서 빠진다.
  gpt-5-mini:
    input_usd_per_million: 0.25
    output_usd_per_million: 2.00
    search_usd_per_1k_calls: 10.00
    source_url: "https://developers.openai.com/api/docs/pricing"
    verified_on: "2026-08-08"
  gpt-5-nano:
    input_usd_per_million: 0.05
    output_usd_per_million: 0.40
    search_usd_per_1k_calls: 10.00
    source_url: "https://developers.openai.com/api/docs/pricing"
    verified_on: "2026-08-08"
  gpt-4o-mini:
    input_usd_per_million: 0.15
    output_usd_per_million: 0.60
    search_usd_per_1k_calls: 25.00
    search_content_tokens_free: true
    source_url: "https://developers.openai.com/api/docs/models/gpt-4o-mini"
    verified_on: "2026-08-08"

  # ── 상위 계열 ─────────────────────────────────────────────────────────────
  gpt-5.5:
    input_usd_per_million: 5.00
    output_usd_per_million: 30.00
    search_usd_per_1k_calls: 10.00
    source_url: "https://developers.openai.com/api/docs/pricing"
    verified_on: "2026-08-08"
  gpt-5.6-sol:
    input_usd_per_million: 5.00
    output_usd_per_million: 30.00
    search_usd_per_1k_calls: 10.00
    source_url: "https://developers.openai.com/api/docs/pricing"
    verified_on: "2026-08-08"
  gpt-5.6-terra:
    input_usd_per_million: 2.00
    output_usd_per_million: 12.00
    search_usd_per_1k_calls: 10.00
    source_url: "https://developers.openai.com/api/docs/pricing"
    verified_on: "2026-08-08"
  gpt-5.6-luna:
    input_usd_per_million: 0.20
    output_usd_per_million: 1.20
    search_usd_per_1k_calls: 10.00
    source_url: "https://developers.openai.com/api/docs/pricing"
    verified_on: "2026-08-08"
