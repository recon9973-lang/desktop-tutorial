# Repository-wide pytest configuration.
#
# apps/api and apps/worker each carry their own config for when you run them in
# isolation. This file exists for the combined run, where two test trees contain
# same-named modules (test_app.py in both). importlib import mode keeps them apart —
# without it pytest resolves the second one against the first one's package root and
# reports failures under a path that does not exist.
[pytest]
testpaths = apps/api/tests apps/worker/tests
pythonpath = apps/api/src apps/api apps/worker/src
# The comment above describes importlib mode; this is where it actually takes effect.
# Without the flag, same-named modules across trees (test_router.py in tests/seo,
# tests/geo and tests/credentials) collide during collection and the combined run dies.
addopts = --strict-markers --import-mode=importlib
markers =
    requires_postgres: test needs a live PostgreSQL instance (VEO_TEST_DATABASE_URL)
    requires_redis: test needs a live Redis broker (VEO_TEST_REDIS_URL)
