name: AI Exposure Check

# 4대 AI(Perplexity·ChatGPT·Gemini·Claude)에 환자 질문을 던져
# 특정 업체가 답변에 노출(언급)되는지 실측한다. GitHub 러너가 배포된 /api/insights를 호출.
# 입력: venom-wordpress/preview/content/ai-expose-input.json ({businesses:[{key,name,cores,questions}]})
# 결과는 로그의 RESULTS_JSON= 한 줄에 JSON으로 출력된다.

on:
  schedule:
    # 매월 1일 00:00 UTC = 09:00 KST — 4대 AI 노출 자동 재측정(월 1회)
    - cron: '0 0 1 * *'
  workflow_dispatch:
    inputs:
      input:
        description: 'input json path'
        required: false
        default: 'venom-wordpress/preview/content/ai-expose-input.json'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run AEO exposure checks
        env:
          # 스케줄 실행 시 inputs.input이 비므로 기본 경로로 폴백
          INPUT: ${{ github.event.inputs.input || 'venom-wordpress/preview/content/ai-expose-input.json' }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          node - "$INPUT" <<'NODE'
          const https = require('https');
          const fs = require('fs');
          const BASE = 'https://venom-new-site.vercel.app';
          const ENGINES = ['perplexity', 'openai', 'gemini', 'claude'];
          const ENG_LABEL = { perplexity: 'Perplexity', openai: 'ChatGPT', gemini: 'Gemini', claude: 'Claude' };
          const OUT_PATH = 'venom-wordpress/preview/content/ai-expose-latest.json';
          const cfg = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));

          function get(url) {
            return new Promise((resolve) => {
              const req = https.get(url, (r) => {
                let d = '';
                r.on('data', c => d += c);
                r.on('end', () => { let j = null; try { j = JSON.parse(d); } catch {} resolve({ status: r.statusCode, json: j }); });
              });
              req.on('error', (e) => resolve({ status: 0, json: { error: e.message } }));
              req.setTimeout(60000, () => { req.destroy(); resolve({ status: 0, json: { error: 'timeout' } }); });
            });
          }
          const norm = s => String(s || '').replace(/\s+/g, '');

          const jobs = [];
          cfg.businesses.forEach(b => b.questions.forEach((q, qi) =>
            ENGINES.forEach(e => jobs.push({ biz: b.key, name: b.name, cores: b.cores || [b.name], e, q, qi }))));

          (async () => {
            const results = [];
            let idx = 0;
            const CONC = 5;
            async function worker() {
              while (idx < jobs.length) {
                const j = jobs[idx++];
                const url = BASE + '/api/insights?type=aeo&engine=' + j.e + '&q=' + encodeURIComponent(j.q) + '&name=' + encodeURIComponent(j.name);
                const r = await get(url);
                const d = r.json || {};
                let verdict = 'none', err = null;
                if (d.error) { verdict = 'error'; err = String(d.error).slice(0, 120); }
                else {
                  const ans = norm(d.answer);
                  const cited = (d.citations || []).some(u => j.cores.some(c => norm(u).includes(norm(c))));
                  const mentioned = d.mentioned === true || j.cores.some(c => ans.includes(norm(c)));
                  verdict = cited ? 'cited' : (mentioned ? 'mentioned' : 'none');
                }
                results.push({ biz: j.biz, e: j.e, qi: j.qi, verdict, err });
                console.log(`  ${j.biz} q${j.qi} ${j.e} -> ${verdict}${err ? ' (' + err + ')' : ''}`);
              }
            }
            await Promise.all(Array.from({ length: CONC }, () => worker()));
            console.log('\nRESULTS_JSON=' + JSON.stringify(results));

            // ── 관리자단 연결용 실측 스냅샷 저장 (grid + 요약) ──
            const byBiz = {};
            results.forEach((r) => { (byBiz[r.biz] = byBiz[r.biz] || {}); (byBiz[r.biz][r.qi] = byBiz[r.biz][r.qi] || {})[r.e] = r.verdict; });
            const EXPOSED = new Set(['cited', 'mentioned']);
            const businesses = cfg.businesses.map((b) => {
              const grid = byBiz[b.key] || {};
              let total = 0, exposed = 0, dcells = 0, dexp = 0, errs = 0;
              b.questions.forEach((q, qi) => ENGINES.forEach((e) => {
                const v = (grid[qi] || {})[e] || 'none';
                if (v === 'error') { errs++; return; }
                total++; if (EXPOSED.has(v)) exposed++;
                if (qi < b.questions.length - 1) { dcells++; if (EXPOSED.has(v)) dexp++; } // 마지막(브랜드) 제외 = 발견형
              }));
              return {
                key: b.key, name: b.name, questions: b.questions, grid,
                summary: {
                  total_cells: total, exposed, disc_cells: dcells, disc_exposed: dexp, errors: errs,
                  tot_pct: total ? Math.round(exposed / total * 100) : 0,
                  disc_pct: dcells ? Math.round(dexp / dcells * 100) : 0,
                },
              };
            });
            const snapshot = {
              generated_at: new Date().toISOString(),
              run_id: String(process.env.GITHUB_RUN_ID || ''),
              engines: ENGINES, eng_label: ENG_LABEL, businesses,
            };
            fs.writeFileSync(OUT_PATH, JSON.stringify(snapshot, null, 2) + '\n');
            console.log('WROTE ' + OUT_PATH);

            // ── 월별 추이용 히스토리 누적 (같은 달이면 최신으로 대체, 최근 36개월 유지) ──
            const HIST_PATH = 'venom-wordpress/preview/content/ai-expose-history.json';
            let hist = [];
            try { hist = JSON.parse(fs.readFileSync(HIST_PATH, 'utf8')); if (!Array.isArray(hist)) hist = []; } catch {}
            const entry = {
              generated_at: snapshot.generated_at,
              run_id: snapshot.run_id,
              businesses: businesses.map((b) => ({
                key: b.key, name: b.name,
                tot_pct: b.summary.tot_pct, disc_pct: b.summary.disc_pct,
                exposed: b.summary.exposed, total_cells: b.summary.total_cells,
              })),
            };
            const ym = String(entry.generated_at).slice(0, 7);
            hist = hist.filter((h) => String(h.generated_at).slice(0, 7) !== ym);
            hist.push(entry);
            hist.sort((a, b) => String(a.generated_at).localeCompare(String(b.generated_at)));
            if (hist.length > 36) hist = hist.slice(hist.length - 36);
            fs.writeFileSync(HIST_PATH, JSON.stringify(hist, null, 2) + '\n');
            console.log('WROTE ' + HIST_PATH);
          })();
          NODE
      - name: Commit snapshot
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -e
          F=venom-wordpress/preview/content/ai-expose-latest.json
          H=venom-wordpress/preview/content/ai-expose-history.json
          git add "$F" "$H"
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(diag): AI 노출 실측 스냅샷·추이 갱신 (run ${GITHUB_RUN_ID})"
          git push origin HEAD:main
        continue-on-error: true
