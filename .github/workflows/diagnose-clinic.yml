name: Diagnose clinic leads function

# /clinic leads 함수의 실제 응답(reason 포함)을 확인하는 진단용 (수동 실행)
# 브라우저는 "접수 중 오류"만 보여주지만 함수는 JSON에 reason을 담아 반환한다.
#   reason=db_error → DB 테이블 없음(스키마 미적재)
#   ok=true         → 정상 (테스트 리드 1건 생성됨)

on:
  workflow_dispatch:
    inputs:
      base:
        description: 'Supabase functions base'
        required: true
        default: 'https://sfybgrfhbmszztvqwgju.supabase.co/functions/v1'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: POST leads (valid payload)
        env:
          BASE: ${{ github.event.inputs.base }}
        run: |
          echo "== POST $BASE/leads =="
          code=$(curl -sS --max-time 60 -o /tmp/resp.json -w "%{http_code}" \
            -X POST "$BASE/leads" \
            -H 'content-type: application/json' \
            -d '{"hospital":"진단테스트","address":"서울 강남구","department":"피부과","name":"진단봇","phone":"010-0000-0000","email":"diag@example.com","delivery":"email","consent_required":true}')
          echo "HTTP $code"
          echo "BODY:"; cat /tmp/resp.json; echo ""
          echo "----"
          echo "해석: reason=db_error → 스키마(테이블) 없음 / ok:true → 정상"
