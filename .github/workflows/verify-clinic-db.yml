name: Verify clinic DB and reload cache

# 테이블 존재 확인 + PostgREST 스키마 캐시 리로드 (수동 실행).
# Edge Function은 Data API(PostgREST) 경유라 새 테이블이 캐시에 반영돼야 접근 가능.

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: 'Supabase 프로젝트 REF'
        required: true
        default: 'sfybgrfhbmszztvqwgju'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query tables + reload PostgREST
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ github.event.inputs.project_ref }}
        run: |
          run_sql () {
            jq -n --arg q "$1" '{query:$q}' > /tmp/b.json
            curl -sS --max-time 60 -X POST \
              "https://api.supabase.com/v1/projects/$REF/database/query" \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              --data @/tmp/b.json
          }
          echo "== public 스키마의 핵심 테이블 존재 확인 =="
          run_sql "SELECT table_name FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('diagnosis_requests','users','reports','self_check_results','auth_challenges','report_grants','abuse_blocklist') ORDER BY table_name;"
          echo ""
          echo "== PostgREST 스키마 캐시 리로드 =="
          run_sql "NOTIFY pgrst, 'reload schema';"
          echo ""
          echo "완료 (테이블 목록이 위에 나오면 생성 성공, 캐시 리로드 실행됨)"
