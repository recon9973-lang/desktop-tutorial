name: Build IG covers

# 배나미 누끼(투명 PNG)를 단색 배경 카드뉴스 커버로 합성해 저장소에 커밋한다.
# 샌드박스는 외부 CDN 접근이 막혀 합성 불가 → 러너에서 크롬으로 렌더.
# 매니페스트: persona-nami/ig/cover-manifest.json

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-covers
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Korean fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-color-emoji

      - name: Setup Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Composite covers
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node persona-nami/ig/build-cover.mjs

      - name: Commit covers
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add persona-nami/ig/post*.png
          if git diff --cached --quiet; then
            echo "커버 변경 없음."
          else
            git commit -m "chore(ig): 배나미 누끼 카드뉴스 커버 합성 [skip ci]"
            git push
          fi
