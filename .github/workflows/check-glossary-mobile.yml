name: Check glossary mobile

on:
  workflow_dispatch:
    inputs:
      url:
        description: '용어사전 페이지 URL'
        required: true
        default: 'https://venom-new-site.vercel.app/seo-dictionary'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: |
          npm init -y >/dev/null 2>&1
          npm i playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - env:
          PAGE_URL: ${{ github.event.inputs.url }}
        run: |
          cat > g.js <<'EOF'
          const { chromium, devices } = require('playwright');
          (async () => {
            const logs = [];
            const b = await chromium.launch();
            const ctx = await b.newContext(devices['iPhone 13']);
            const p = await ctx.newPage();
            p.on('console', m => { if(m.type()==='error') logs.push('[err] '+m.text()); });
            p.on('pageerror', e => logs.push('[pageerror] '+e.message));
            p.on('requestfailed', r => logs.push('[reqfail] '+r.url()));
            const resp = await p.goto(process.env.PAGE_URL, {waitUntil:'networkidle', timeout:60000});
            console.log('PAGE HTTP', resp && resp.status());
            await p.waitForTimeout(2500);
            const info = await p.evaluate(() => {
              const root = document.getElementById('glossary-root');
              const cs = root ? getComputedStyle(root) : null;
              const page = document.querySelector('[data-page="seo-dict"], #page-seo-dict, .page.seo-dict');
              return {
                Glossary: typeof window.Glossary,
                glossaryScript: !!document.querySelector('script[src*="glossary"]'),
                rootExists: !!root,
                rootHTMLlen: root ? root.innerHTML.length : -1,
                rootTextlen: root ? root.innerText.trim().length : -1,
                rootDisplay: cs ? cs.display : 'n/a',
                rootVisibility: cs ? cs.visibility : 'n/a',
                cards: document.querySelectorAll('.gl-card, .gl-grid > *').length,
                controls: !!document.getElementById('gl-controls')
              };
            });
            console.log('INFO', JSON.stringify(info, null, 2));
            const eng = await p.evaluate(async () => { try{ const r=await fetch('/assets/glossary.js?v=1.0.0'); return r.status+' '+(r.headers.get('content-type')||''); }catch(e){ return 'ERR '+e.message; } });
            console.log('glossary.js(/assets/) =', eng);
            const engRel = await p.evaluate(async () => { try{ const r=await fetch('assets/glossary.js?v=1.0.0'); return r.status+' '+(r.headers.get('content-type')||''); }catch(e){ return 'ERR '+e.message; } });
            console.log('glossary.js(relative) =', engRel);
            console.log('\n== 콘솔 에러 ==\n' + (logs.slice(0,25).join('\n')||'(없음)'));
            await b.close();
          })().catch(e=>{console.log('FATAL',e.message);process.exit(1);});
          EOF
          node g.js
