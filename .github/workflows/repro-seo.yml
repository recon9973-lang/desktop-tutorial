name: Repro SEO measure (Playwright)

# 라이브 페이지를 실제 브라우저로 몰아 SEO 측정 실패를 재현·진단 (수동 실행).

on:
  workflow_dispatch:
    inputs:
      url:
        description: '진단 페이지 URL'
        required: true
        default: 'https://venom-new-site.vercel.app/diagnose'
      target:
        description: 'SEO로 측정할 대상 URL'
        required: true
        default: 'https://example.com'

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Setup
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          echo "playwright ready"
      - name: Drive page
        env:
          PAGE_URL: ${{ github.event.inputs.url }}
          TARGET: ${{ github.event.inputs.target }}
        run: |
          cat > run.js <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const logs = [];
            const b = await chromium.launch();
            const p = await b.newPage();
            p.on('console', m => logs.push('['+m.type()+'] '+m.text()));
            p.on('pageerror', e => logs.push('[PAGEERROR] '+e.message));
            p.on('requestfailed', r => logs.push('[REQFAIL] '+r.url()+' '+(r.failure()&&r.failure().errorText)));
            const resp = await p.goto(process.env.PAGE_URL, {waitUntil:'networkidle', timeout:60000});
            console.log('PAGE HTTP', resp && resp.status());
            const probe = await p.evaluate(() => ({
              SEOEngine: typeof window.SEOEngine,
              runSEO: typeof window.runSEO,
              hasInput: !!document.getElementById('seo-url'),
              engineScript: !!document.querySelector('script[src*="seo-engine"]')
            }));
            console.log('PROBE', JSON.stringify(probe));
            const engStatus = await p.evaluate(async () => {
              try { const r = await fetch('/assets/seo-engine.js?v=1.4.0'); return r.status; } catch(e){ return 'ERR '+e.message; }
            });
            console.log('seo-engine.js fetch status:', engStatus);
            if (probe.hasInput && probe.runSEO === 'function') {
              await p.evaluate((t) => { document.getElementById('seo-url').value = t; window.runSEO(); }, process.env.TARGET);
              await p.waitForTimeout(18000);
              const html = await p.evaluate(() => { const el=document.getElementById('seo-result'); return el ? el.innerText.slice(0,500) : '(no #seo-result)'; });
              console.log('RESULT(앞 500자):\n', html);
            } else {
              console.log('실행 불가 — runSEO 또는 입력칸 없음');
            }
            console.log('\n===== 콘솔/에러 로그 =====');
            console.log(logs.slice(0,40).join('\n') || '(없음)');
            await b.close();
          })().catch(e => { console.log('FATAL', e.message); process.exit(1); });
          EOF
          node run.js
